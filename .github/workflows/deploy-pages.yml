name: Deploy web build to Pages

# Exports the Godot web build and publishes it to GitHub Pages at
# https://tmegill1.github.io/astral-forge/.
#
# The export is built here rather than committed: export/ is gitignored and a
# 40MB wasm has no business in git history. The engine and export templates are
# downloaded at run time, pinned to the version the project is developed with.
#
# To take the site down (e.g. when moving to itch.io): Settings > Pages >
# Unpublish site (or `gh api -X DELETE repos/Tmegill1/astral-forge/pages`),
# then delete this file so the next push doesn't publish it again.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel a half-finished one, or the site can end
# up serving a partial upload.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.7.1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The templates archive is over 1GB; cache it per engine version.
      - name: Cache export templates
        id: templates-cache
        uses: actions/cache@v6
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-export-templates-${{ env.GODOT_VERSION }}-stable

      - name: Install Godot ${{ env.GODOT_VERSION }}
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o godot.zip "${base}/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          godot --version

      - name: Install export templates
        if: steps.templates-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o templates.tpz "${base}/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          # A .tpz is a zip whose contents sit in a single templates/ directory.
          unzip -q templates.tpz
          mkdir -p ~/.local/share/godot/export_templates
          mv templates "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"

      # .godot/ is gitignored, so a fresh checkout has no class_name cache or
      # imported textures; build them first. The import prints errors on a
      # clean project too, so its exit code isn't useful: the export is.
      - name: Import project
        run: godot --headless --import || true

      - name: Export web build
        run: |
          set -euo pipefail
          mkdir -p export/web
          godot --headless --export-release "Web" export/web/index.html
          test -f export/web/index.wasm
          test -f export/web/index.pck

      # Keep Jekyll from ignoring files that start with an underscore.
      - name: Disable Jekyll processing
        run: touch export/web/.nojekyll

      - name: Report build size
        run: |
          echo "### Web build" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ls -lh export/web | awk 'NR>1 {printf "%-34s %s\n", $9, $5}' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: export/web
          # Otherwise the hidden .nojekyll is dropped from the upload.
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
